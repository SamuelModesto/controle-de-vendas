services:
  db:
    image: mysql:8.4
    container_name: vendas-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vendasdb
      MYSQL_USER: vendas
      MYSQL_PASSWORD: vendas
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vendas-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/vendasdb?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: vendas
      SPRING_DATASOURCE_PASSWORD: vendas
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: default
      TZ: UTC
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  mysql_data:

